<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Playoff Odds V3 (Node.js)</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="bracket.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">
        <header>
            <h1>NFL Playoff And Super Bowl Odds</h1>
            <p class="subtitle">Real-time Monte Carlo Simulation (1000 iter). Live data from ESPN. (Client-Side
                Rendering)</p>
        </header>

        <div class="controls-header">
            <div id="loading-indicator" class="loading-indicator">
                <span class="spinner-icon"
                    style="display: inline-block; animation: spin 1s linear infinite; margin-right: 5px;">&#9696;</span>
                Updating Odds...
            </div>
            <button id="simulate-btn" style="display:none;">Run Simulation</button>
        </div>

        <!-- Ticker -->
        <div id="ticker-container"></div>

        <!-- Key Games (Upside) -->
        <div id="key-games-container"></div>

        <div class="app-layout">
            <!-- Main Content Area (Table or Bracket) -->
            <div id="main-content" class="main-area">
                <!-- Tabs -->
                <div style="text-align: center; margin-bottom: 20px;">
                    <div class="table-tabs" style="display: inline-flex;">
                        <button class="table-tab-btn active" onclick="renderView('league')">League</button>
                        <button class="table-tab-btn" onclick="renderView('conf')">Conference</button>
                        <button class="table-tab-btn" onclick="renderView('div')">Division</button>
                        <button class="table-tab-btn" onclick="renderView('playoffs')">Playoffs</button>
                    </div>
                </div>

                <div id="view-container">
                    <!-- Content injected here by JS -->
                </div>
            </div>

            <aside class="stories-aside">
                <div class="aside-header">LATEST STORIES</div>
                <div id="stories-viewport">
                    <!-- Stories injected here -->
                </div>
            </aside>
        </div>

        <div class="footer-note">
            <p>* Probabilities generated by 1,000 Monte Carlo simulations of remaining schedule + simplified
                tiebreakers. (Node.js Backend)</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
